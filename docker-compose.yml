# CampaignCue — Local Development Services
# Run: docker-compose up -d

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: campaigncue
      MYSQL_ROOT_PASSWORD: mysql
    ports:
      # Host port 3308: 3306 and 3307 are taken by other projects' databases
      # on this machine. Change it if your machine has it free.
      - "3308:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pmysql"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysqldata:
